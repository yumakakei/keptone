#
# Keptone as a Cargo workspace: every crate is under crates/, and none is fetched
# from crates.io (cargo runs with --locked, and Cargo.lock names the workspace's
# own crates only). A dependency is added only with its entry in
# docs/DEPENDENCIES.md, and the operating systems' functions are declared by hand
# (keptone-sys).
#
# The lints are kiral's and JPEG-Unround's: missing documentation, missing Debug
# and needless qualifications are errors, clippy's pedantic group too, `as`
# conversions are denied in favour of checked ones, and every unsafe block holds
# one operation and says why it is sound. Crates that need no unsafe code forbid
# it in their roots; the others confine it as docs/DESIGN.md §4 says.
#
# Release builds abort on a panic rather than unwind (docs/DESIGN.md §9.3): a bug
# shows as a crash, never as unwinding through the host's C frames. Cargo builds
# tests to unwind whatever the profile says, as the test harness needs.

[workspace]
members = ["crates/*"]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.100"
license = "GPL-3.0-or-later"
repository = "https://github.com/yumasansansan/keptone"
publish = false

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "forbid"
missing_debug_implementations = "deny"
missing_docs = "deny"
unused_qualifications = "deny"

[workspace.lints.clippy]
pedantic = { level = "deny", priority = -1 }
undocumented_unsafe_blocks = "deny"
multiple_unsafe_ops_per_block = "deny"
cast_lossless = "deny"
as_conversions = "deny"

[profile.release]
panic = "abort"
