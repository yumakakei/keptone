[package]
name = "keptone-clap"
description = "Keptone as a CLAP plugin: the ABI declared by hand, the entry and the extensions"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[lib]
# The CLAP plugin is the shared library; the VST3, AUv2 and standalone wrappers
# (wrappers/) link the static one, and Rust code and tests the rlib.
crate-type = ["cdylib", "staticlib", "rlib"]

[lints]
workspace = true
