#
# keptone-tools's configuration of clippy, which takes it in place of the
# workspace's ../../clippy.toml and merges nothing: the workspace's names, and
# f64's and f32's elementary functions refused. Those call the system's libm,
# whose results differ between systems and versions; keptone-tools takes
# keptone-math's instead (docs/MATH.md §12, docs/DESIGN.md §4).
#
# Names that documentation writes as names, not as code ("..": and clippy's own).
doc-valid-idents = ["AArch64", "AppKit", "AUv2", "FreeType", "HarfBuzz", "SysEx", ".."]
disallowed-methods = [
    { path = "f64::ln", reason = "the system's libm: take keptone-math's (MATH §12)" },
    { path = "f64::log", reason = "the system's libm: take keptone-math's (MATH §12)" },
    { path = "f64::log2", reason = "the system's libm: take keptone-math's (MATH §12)" },
    { path = "f64::log10", reason = "the system's libm: take keptone-math's (MATH §12)" },
