#
# The CI jobs of docs/DESIGN.md §13.2 that exist so far; each runs a script of
# ci/, which runs the same on a machine of one's own.
#
# The rust job checks and tests the workspace on each of the three systems
# Keptone runs on (ci/rust.sh), with the latest stable toolchain
# (rust-toolchain.toml): its layout, clippy with every warning an error, the
# documentation with every warning of rustdoc an error, and the tests in the dev
# and the release profile. The x86-64 builds are for x86-64-v3, the macOS ones
# for Apple silicon, macOS 26.0 and later. ci/setup.sh, before it, installs the
# pinned LLVM and checks that its Clang contracts floating-point operations as
# the project needs, and ci/core-math.sh fetches the files of CORE-MATH that the
# tests of keptone-math compile with that Clang, to compare its functions with
# CORE-MATH's correctly rounded ones.
#
# The targets job builds the workspace for x86-64-v4, with vectors of 512 bits,
# and tests the build where the runner has AVX-512 (ci/targets.sh). The levels no
# runner can be counted on to have are tested under Intel's SDE, on a machine of
# one's own (ci/emulated.sh).
#
# The python job checks scripts/ with ruff (ci/python.sh), and the reuse job
# checks with reuse lint, from Ubuntu's reuse package, that every file names its
# copyright holder and license (REUSE.toml, LICENSES/).
#
# The fuzz job fuzzes each parser of keptone-model with libFuzzer for a minute,
# on Ubuntu, from its seed inputs and the inputs that once made it fail
# (ci/fuzz.sh): the targets, outside the workspace (fuzz/libfuzzer), are built
# by a pinned nightly toolchain and cargo-fuzz with the address sanitizer. An
# input that fails is kept as an artifact of the run. The long fuzzing, once a
# day, is a workflow of its own (fuzz.yml).
#
# The checkout is plain git, CORE-MATH's files included (ci/core-math.sh), and
# ci/setup.sh installs a pinned LLVM toolchain, as in kiral, JPEG-Unround and
# ADLplug-Next. The one action used is GitHub's own actions/upload-artifact, in
# the fuzz job, pinned to the commit of its release as ADLplug-Next pins it; no
# action from elsewhere is used.

name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

defaults:
  run:
    shell: bash

jobs:
  rust:
    name: rust (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-26.04, macos-26]

    steps:
      - name: Check out
        run: |
          # The commit alone. Git keeps the files as committed on every runner.
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git log -1 --format='%H %s'

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Fetch CORE-MATH for the tests
        run: bash ci/core-math.sh

      - name: Check and test
        run: bash ci/rust.sh

  targets:
    name: x86-64-v4 (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        os: [windows-2025-vs2026, ubuntu-26.04]

    steps:
      - name: Check out
        run: |
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git log -1 --format='%H %s'

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Fetch CORE-MATH for the tests
        run: bash ci/core-math.sh

      - name: Build for x86-64-v4, and test where the runner has it
        run: bash ci/targets.sh test

  python:
    name: python (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check out
        run: |
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git log -1 --format='%H %s'

      - name: Install ruff
        run: |
          # The latest release when the pin was set; pipx comes with the
          # runner, and keeps ruff apart from the system's Python.
          pipx install ruff==0.17.5

      - name: Check the scripts
        run: bash ci/python.sh

  reuse:
    name: REUSE compliance
    runs-on: ubuntu-26.04
    timeout-minutes: 15

    steps:
      - name: Check out
        run: |
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git log -1 --format='%H %s'

      - name: Install reuse
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq --no-install-recommends reuse
          reuse --version

      - name: Check the licensing of every file
        run: reuse lint

  fuzz:
    name: fuzz (ubuntu-26.04)
    runs-on: ubuntu-26.04
    timeout-minutes: 60

    steps:
      - name: Check out
        run: |
          git config --global core.autocrlf false
          git -c init.defaultBranch=main init --quiet
          git remote add origin "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY.git"
          git fetch --no-tags --quiet --depth 1 origin "$GITHUB_SHA"
          git checkout --quiet --detach "$GITHUB_SHA"
          git log -1 --format='%H %s'

      - name: Set up the toolchain
        run: bash ci/setup.sh

      - name: Set up the fuzzing
        run: bash ci/fuzz.sh setup

      - name: Fuzz each target for a minute
        run: bash ci/fuzz.sh 60 fuzz-run/corpora fuzz-run/crashes

      # An input that failed, for the commit that fixes what it found to put
      # into fuzz/regressions.
      - name: Keep the inputs that failed
        if: ${{ failure() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: fuzz-crashes
          path: fuzz-run/crashes/
          if-no-files-found: ignore
          retention-days: 90
